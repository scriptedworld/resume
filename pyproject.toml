[project]
name = "resume"
version = "1.0.0"
description = "One resume, as a web page and as a PDF, built from one markdown file"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-markdown>=0.5",
]

# Nothing here is installed. build-page.py runs inside the project
# environment, which is all the dependencies above are for.
[tool.uv]
package = false
